<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Oryx Admin - Control</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #eee; padding: 20px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 15px; max-width: 900px; margin: auto; border: 1px solid #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #333; text-align: left; }
        th { background: #333; color: #4caf50; }
        select { background: #2c2c2c; color: white; padding: 5px; border-radius: 5px; }
        .logo-btn { color: #4caf50; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="color: #4caf50;">Oryx Group - Admin Panel</h2>
    <table id="orderTable">
        <thead>
            <tr>
                <th>Order ID</th>
                <th>Business</th>
                <th>Logo</th>
                <th>Update Status</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAcmHCVoSCtSIFWsHvs6nmxlfSGE6hFDFo",
        authDomain: "oryx-partner-database.firebaseapp.com",
        databaseURL: "https://oryx-partner-database-default-rtdb.firebaseio.com",
        projectId: "oryx-partner-database"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref('orders/').on('value', snapshot => {
        const tbody = document.querySelector("#orderTable tbody");
        tbody.innerHTML = "";
        snapshot.forEach(child => {
            const d = child.val();
            tbody.innerHTML += `
                <tr>
                    <td>${d.orderId}</td>
                    <td>${d.business}</td>
                    <td><a href="${d.logo}" target="_blank" class="logo-btn">View Logo</a></td>
                    <td>
                        <select onchange="updateTrack('${d.orderId}', this.value)">
                            <option selected>${d.status}</option>
                            <option value="Printing">Printing</option>
                            <option value="Making">Making</option>
                            <option value="Drying">Drying</option>
                            <option value="Transporting">Transporting</option>
                            <option value="Reached Customer">Reached Customer</option>
                        </select>
                    </td>
                </tr>`;
        });
    });

    function updateTrack(id, status) {
        db.ref('orders/' + id).update({ status: status, time: new Date().toLocaleString() })
        .then(() => alert("Status Updated!"));
    }
</script>
</body>
</html>
