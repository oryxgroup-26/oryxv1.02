<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oryx Group - Central Portal</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-card { 
            background: #fff; 
            padding: 40px; 
            border-radius: 25px; 
            box-shadow: 0 15px 50px rgba(0,0,0,0.1); 
            text-align: center; 
            width: 350px; 
        }
        .logo { 
            color: #1b5e20; 
            font-size: 35px; 
            font-weight: bold; 
            margin-bottom: 30px; 
            letter-spacing: 1px; 
        }
        .btn { 
            display: block; 
            width: 100%; 
            padding: 16px; 
            margin: 15px 0; 
            border: none; 
            border-radius: 12px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s; 
            text-decoration: none; 
            box-sizing: border-box;
        }
        .btn-partner { 
            background: #1b5e20; 
            color: white; 
        }
        .btn-admin { 
            background: #333; 
            color: white; 
        }
        .btn:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); 
        }
        
        /* Password Modal */
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.7); 
            justify-content: center; 
            align-items: center; 
            z-index: 100; 
        }
        .modal-content { 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            width: 300px; 
            text-align: center; 
        }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 20px 0; 
            border: 2px solid #eee; 
            border-radius: 10px; 
            box-sizing: border-box; 
            font-size: 16px; 
            outline: none; 
        }
        input:focus { 
            border-color: #1b5e20; 
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo">Oryx Group</div>
    <p style="color: #666; font-size: 14px; margin-bottom: 30px;">Select your access portal</p>
    
    <a href="partner.html" class="btn btn-partner">Partner Portal</a>
    
    <button onclick="openAdminModal()" class="btn btn-admin">Admin Access</button>
</div>

<div id="adminModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top: 0; color: #333;">Admin Verification</h3>
        <input type="password" id="adminPass" placeholder="Enter Secret Password">
        <button onclick="verifyAndLogin()" class="btn btn-admin" style="margin: 0;">Login</button>
        <button onclick="closeAdminModal()" style="background:none; border:none; color:red; margin-top:15px; cursor:pointer; font-weight:bold;">Cancel</button>
    </div>
</div>

<script>
    function openAdminModal() {
        document.getElementById('adminModal').style.display = 'flex';
    }

    function closeAdminModal() {
        document.getElementById('adminModal').style.display = 'none';
        document.getElementById('adminPass').value = ""; 
    }

    function verifyAndLogin() {
        const pass = document.getElementById('adminPass').value;
        // আপনার সিক্রেট পাসওয়ার্ড
        if (pass === "Rhsrafi24109") {
            window.location.href = "indexadmin.html";
        } else {
            alert("❌ Incorrect Password! Access Denied.");
            document.getElementById('adminPass').value = "";
        }
    }

    // Enter বাটন প্রেস করলে লগইন হবে
    document.getElementById('adminPass').addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            verifyAndLogin();
        }
    });
</script>

</body>
          </html>
